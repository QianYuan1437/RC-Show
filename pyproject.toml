[project]
name = "rczoo"
version = "0.1.0"
description = "A zoo of robot-arm control modes (position / velocity / torque, impedance, admittance, force, OSC, MPC, iLQR, RL) with MuJoCo Warp benchmarks and an interactive GitHub Pages site"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "mujoco>=3.3.7",
  "mujoco-warp>=3.3.7",
  "warp-lang>=1.10",
  "torch==2.9.1",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "tqdm",
  "pyyaml",
  "trimesh",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rczoo"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B023: lambdas evaluated immediately inside the loop; RUF046: int(round(x)) kept for clarity
ignore = ["B023", "RUF046"]
